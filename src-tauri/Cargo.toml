[package]
name = "explorer-app"
version = "1.0.0"
description = "Fast, modern Windows 11 file explorer with native filesystem navigation"
authors = ["Explorer App Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
chrono = "0.4"
dirs = "5.0"

[features]
default = []
portable = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
